{% load static %}
<html>
    <head>
        <title>BookClub</title>
        <link rel="stylesheet" href="{% static 'bookClub-style.css' %}">
    </head>
    <body>
        <nav>
            <a href="{% url 'books' %}" class="nav-logo">BookClub</a>

            <form method="GET" action="{% url 'books' %}" class="nav-search">
                <input type="text" name="search" placeholder="Search books...">
                <button type="submit">Search</button>
            </form>

            <div class="nav-links">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'add_book' %}">+ Add Book</a>
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit">Sign Out</button>
                    </form>
                    {% if request.user.reader_set.first %}
                    <a href="{% url 'reader' request.user.reader_set.first.pk %}">{{ request.user.username }}</a>
                    {% else %}
                    <span>{{ request.user.username }}</span>
                    {% endif %}
                {% else %}
                    <a href="{% url 'login' %}">Sign In</a>
                    <a href="{% url 'register' %}">Sign Up</a>
                {% endif %}
            </div>
        </nav>
        <div class="page-content">
            {% block content %}
            {% endblock %}
        </div>
    </body>
</html>
