{% extends 'BookClub/base.html' %}
{% block content %}
<h2>Sign Up</h2>
<form method="POST">
  {% csrf_token %}
  {{ user_form.as_p }}
  {{ reader_form.as_p }}
  <button type="submit">Create Account</button>
</form>
<a href="{% url 'login' %}">Already have an account? Sign in</a>
{% endblock %}
