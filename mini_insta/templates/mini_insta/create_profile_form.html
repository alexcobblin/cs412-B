{% extends 'mini_insta/base.html' %}


{% block content %}

<form method="POST">
  {% csrf_token %}
  <h3>Create Account</h3>
  {{ user_creation_form.as_p }}
  <h3>Profile Info</h3>
  {{ form.as_p }}
  <button type="submit">Create Profile</button>
</form>
{% endblock %}
