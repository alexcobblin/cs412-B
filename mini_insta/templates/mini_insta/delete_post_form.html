{% extends 'mini_insta/base.html' %}
 
{% block content %}
<main class="grid-container">
        <form method='POST'>
            <h3>Are you sure you want to delete this post?</h3>
        
            <p>
            {{post}}
            </p>
            <td><a href="{% url 'post' post.pk %}">← Cancel</a></td>
            {% csrf_token %}
            <input type='submit' value="Delete">
        </form>
    </post>
</main>
{% endblock %}
