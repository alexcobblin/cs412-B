<!-- quotes/templates/quotes/show_all.html -->
{% extends 'quotes/base.html' %}
 
 
{% block content %}
 
 
 
 
<div>
    <h1>All Quotes By The Cookie Monster</h1>
    <body>
        {% for j in images %}
            <img src="{{j}}" alt="Monster">
        {% endfor %}
        
        {% for i in cookies %}
            <li>{{i}}</li>
        {% endfor %}
    </body>
 
 
</div>
 
 
{% endblock %}
